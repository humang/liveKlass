apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: liveklass-httproute
  namespace: default
  labels:
    app: liveklass-routing
spec:
  parentRefs:
    - name: liveklass-gateway
  hostnames:
    - "liveklass.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/api/events"
      backendRefs:
        - name: app-service
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: "/dashboard"
      backendRefs:
        - name: dashboard-service
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: dashboard-service
          port: 80
          weight: 1
